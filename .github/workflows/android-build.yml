name: Build APK

# Builds an installable APK on every push and publishes it as a GitHub Release, so it
# can be installed from a phone with one tap: <repo>/releases/latest
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Every build must be signed with the same key, or Android refuses to install it
      # over the previous one. The key lives in repository secrets, never in the repo.
      # Without the secrets, the build still works but uses a throwaway debug key.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-for-change-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/drive-for-change-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/*.apk "$apk"
          gh release create "build-${{ github.run_number }}" "$apk" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} at ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
